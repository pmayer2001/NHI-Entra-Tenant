# Demonstrates the service-principal fallback backend (ADR-003) next to Agent ID.
# Same reusable agent as wf-claims-triage (P2), separate NHI because it's a separate
# (workflow, agent) pair (P3): an app registration + SP instead of an agent identity.
kind: Workflow
id: wf-sp-backend-demo
name: Service-principal backend demo
business_owner: "{owner}@{tenant_domain}"
sponsor: "{owner}@{tenant_domain}"
data_classification: restricted
status: active
backend: service_principal
expires: 2027-01-31            # a demo: short-lived on purpose
review_by: 2026-12-31
agents:
  - ref: agent-router
    runtimes: [local]
    expected_cadence: on-demand
    permissions:
      - resource: res-sensitive-records
        app_roles: [Records.Read.Metadata]
