# Usage analytics demo (ADR-013): a deliberately over-granted agent must be flagged.
# The summarizer only ever reads single records (Records.Read.Redacted). It was first
# granted Records.Read.Metadata too: within its max_permissions, so validation allowed
# it, but nothing it does needs it. `nhigov usage analyze` flagged it on 2026-11-06
# (NHI-012: never used in 4 days, expected hourly), so it was removed here and
# `apply` revokes the grant.
kind: Workflow
id: wf-usage-demo
name: Usage analytics demo (over-granted on purpose, then fixed)
business_owner: "{owner}@{tenant_domain}"
sponsor: "{owner}@{tenant_domain}"
data_classification: restricted
status: active
expires: 2027-02-01
review_by: 2026-12-31
agents:
  - ref: agent-summarizer
    runtimes: [local]
    expected_cadence: hourly   # judged after 3 hours of log since the NHI was created
    permissions:
      - resource: res-sensitive-records
        app_roles: [Records.Read.Redacted]   # Records.Read.Metadata removed: NHI-012
