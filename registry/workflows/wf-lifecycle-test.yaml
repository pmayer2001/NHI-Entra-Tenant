# Lifecycle test (ADR-012): sponsor an NHI with a test user, disable the user,
# run the lifecycle, and the NHI must end up disabled after the sponsor grace period.
kind: Workflow
id: wf-lifecycle-test
name: Lifecycle test (departing sponsor)
business_owner: "{owner}@{tenant_domain}"
sponsor: test-departing-sponsor@{tenant_domain}   # the user who "leaves"
data_classification: restricted
status: retired                # test done (sponsor-departure verified); NHI goes through retirement
expires: 2027-01-31
review_by: 2026-12-31
agents:
  - ref: agent-router
    runtimes: [local]
    expected_cadence: on-demand
    permissions:
      - resource: res-sensitive-records
        app_roles: [Records.Read.Metadata]
