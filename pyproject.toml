[project]
name = "nhigov"
version = "0.1.0"
description = "NHI governance for agentic workflows on Microsoft Entra ID"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.19",
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
nhigov = "nhigov.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhigov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake tokens in fixtures

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["live: requires a real tenant and certificates"]
